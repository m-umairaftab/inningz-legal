<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Follow live cricket ball-by-ball score on Inningz. Real-time scores, player stats, commentary ribbon, and scorecards.">
<title>Live Match - Inningz</title>
<link rel="icon" type="image/png" sizes="48x48" href="../favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Sora:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#0B1220; --surface:#111B30; --surface-sub:#17233D; --fg:#E7EDF5; --muted:#92A3B8; --line:#1E2B44;
  --accent:#4ADE9A; --accent-bg:#0E2A22; --accent-line:#1B5A43;
  --pulse:#FF455B; --pulse-bg:#2B1218;
  --warn:#FDBA9B; --warn-bg:#2B1812;
  --ball-boundary:#10B981; --ball-six:#059669; --ball-wicket:#EF4444; --ball-dot:#334155; --ball-extra:#F59E0B;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-display:'Sora','Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F7F5; --surface:#FFFFFF; --surface-sub:#EDF3F0; --fg:#0F172A; --muted:#546274; --line:#DAE3DE;
    --accent:#157A3E; --accent-bg:#E7F4EC; --accent-line:#BFE0CB;
    --pulse:#D6283A; --pulse-bg:#FDECEE;
    --warn:#9A3412; --warn-bg:#FDEFE8;
    --ball-boundary:#157A3E; --ball-six:#0D5229; --ball-wicket:#DC2626; --ball-dot:#CBD5E1; --ball-extra:#D97706;
    color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:400 15px/1.5 var(--font-body);
  padding-block:16px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:32rem;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}

/* Header */
.top-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:700 1.1rem/1 var(--font-display);color:var(--fg);text-decoration:none}
.brand b{color:var(--accent)}
.live-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 0.72rem/1 var(--font-mono);text-transform:uppercase;letter-spacing:0.06em;background:var(--pulse-bg);color:var(--pulse);border:1px solid rgba(255,69,91,0.2)}
.live-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--pulse);animation:pulse-anim 1.5s infinite}
@keyframes pulse-anim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}}

/* Match Status Banner */
.match-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.match-meta{display:flex;justify-content:space-between;align-items:center;font:500 0.76rem/1.3 var(--font-mono);color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px}

/* Teams Header */
.teams-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.team-item{display:flex;flex-direction:column;gap:2px;flex:1}
.team-item.right{text-align:right}
.team-name{font:700 1.15rem/1.2 var(--font-display);color:var(--fg)}
.team-sub{font:500 0.8rem/1.2 var(--font-mono);color:var(--muted)}

/* Big Score Box */
.score-box{background:var(--surface-sub);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end}
.big-score{font:800 2.2rem/1 var(--font-display);letter-spacing:-0.03em;color:var(--fg)}
.overs-text{font:600 1.05rem/1 var(--font-mono);color:var(--muted);margin-left:6px}
.run-rates{text-align:right;display:flex;flex-direction:column;gap:3px;font:500 0.76rem/1.2 var(--font-mono);color:var(--muted)}
.run-rates b{color:var(--fg)}

/* Target / Result Banner */
.equation-banner{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:10px;padding:10px 14px;font:600 0.82rem/1.3 var(--font-mono);color:var(--accent);text-align:center}
.equation-banner.finished{background:var(--surface-sub);border-color:var(--line);color:var(--fg)}

/* Recent Deliveries Ribbon */
.section-title{font:600 0.74rem/1 var(--font-mono);text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:6px}
.ball-ribbon{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ball-ribbon::-webkit-scrollbar{display:none}
.ball-item{min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 0.78rem/1 var(--font-mono);background:var(--ball-dot);color:#FFFFFF;flex-shrink:0}
.ball-item.b-four{background:var(--ball-boundary)}
.ball-item.b-six{background:var(--ball-six);box-shadow:0 0 6px rgba(16,185,129,0.4)}
.ball-item.b-wicket{background:var(--ball-wicket);box-shadow:0 0 6px rgba(239,68,68,0.4)}
.ball-item.b-extra{background:var(--ball-extra)}

/* Tables for Batters & Bowler */
.stats-table{width:100%;border-collapse:collapse;font-size:0.86rem}
.stats-table th{font:600 0.68rem/1 var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;padding:6px 4px;text-align:right}
.stats-table th:first-child{text-align:left}
.stats-table td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;font:500 0.84rem/1.2 var(--font-mono)}
.stats-table td:first-child{text-align:left;font:600 0.88rem/1.2 var(--font-body);color:var(--fg)}
.striker-star{color:var(--accent);margin-left:2px}

/* Innings History List */
.innings-history{display:flex;flex-direction:column;gap:8px}
.innings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font:500 0.85rem/1.2 var(--font-mono)}

/* Footer CTA */
.app-cta{background:linear-gradient(135deg, var(--surface) 0%, var(--surface-sub) 100%);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cta-info h3{font:700 1rem/1.2 var(--font-display);color:var(--fg)}
.cta-info p{font:400 0.78rem/1.4 var(--font-body);color:var(--muted);margin-top:4px}
.cta-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#0B1220;font:700 0.82rem/1 var(--font-display);padding:10px 16px;border-radius:10px;text-decoration:none;white-space:nowrap}

/* Status message */
.offline-banner{background:var(--warn-bg);border:1px solid rgba(253,186,155,0.25);border-radius:10px;padding:8px 12px;font:500 0.75rem/1.3 var(--font-mono);color:var(--warn);display:flex;align-items:center;gap:8px}
.sync-time{font:400 0.7rem/1 var(--font-mono);color:var(--muted);text-align:center;margin-top:4px}
.error-box{padding:30px 16px;text-align:center;background:var(--surface);border-radius:16px;border:1px solid var(--line)}
.error-box h2{font:700 1.2rem var(--font-display);margin-bottom:8px}
.error-box p{color:var(--muted);font-size:0.9rem}

/* Skeleton loader */
.skeleton{animation:pulse 1.4s ease-in-out infinite;background:rgba(255,255,255,0.06);border-radius:8px}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.8}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <!-- Top Navigation -->
  <header class="top-nav">
    <a href="../" class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12h5l2-4 4 8 3-6 2 2h4"/>
      </svg>
      <span>Inningz<b>.</b></span>
    </a>
    <div id="liveStatusBadge" class="live-pill">
      <span class="dot"></span>
      <span id="liveStatusText">LIVE</span>
    </div>
  </header>

  <!-- Dynamic Content Container -->
  <main id="mainContent">
    <div class="match-card">
      <div class="skeleton" style="height:18px;width:60%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:36px;width:100%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:80px;width:100%"></div>
    </div>
  </main>

  <!-- Download App CTA -->
  <aside class="app-cta">
    <div class="cta-info">
      <h3>Score like a Pro 🏏</h3>
      <p>Free ball-by-ball cricket scoring app for street & club matches.</p>
    </div>
    <a href="https://play.google.com/store/apps/details?id=com.inningz.app" target="_blank" rel="noopener" class="cta-btn">
      Install App
    </a>
  </aside>

  <footer class="sync-time" id="syncFooter">
    Connecting to live scorer...
  </footer>
</div>

<script>
(function() {
  const ENVIRONMENTS = [
    {
      name: 'prod',
      url: 'https://eagmswyijddacfarkevt.supabase.co',
      anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhZ21zd3lpamRkYWNmYXJrZXZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDkzMzksImV4cCI6MjEwODU4NTMzOX0.U27Uv2Yx5KMR3oN7wfngjYt8kupc9C28kGdxiHphTHY'
    },
    {
      name: 'stg',
      url: 'https://wyfkzazvgiwxbnmwldsc.supabase.co',
      anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5Zmt6YXp2Z2l3eGJubXdsZHNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MzA2NDQsImV4cCI6MjEwODMwNjY0NH0.ymElJsepIUuLLLl0TQ23H4-FIhWNDfq8TnRzazK5PG0'
    }
  ];

  const params = new URLSearchParams(window.location.search);
  const matchId = params.get('id') || params.get('code') || '';

  const mainEl = document.getElementById('mainContent');
  const liveBadgeEl = document.getElementById('liveStatusBadge');
  const liveTextEl = document.getElementById('liveStatusText');
  const footerEl = document.getElementById('syncFooter');

  let pollTimer = null;
  let lastUpdatedAt = null;
  let activeEnv = null;

  if (!matchId) {
    showError('Match Not Specified', 'Please open a valid live match link shared from Inningz app.');
    return;
  }

  async function callRpc(env) {
    try {
      const response = await fetch(`${env.url}/rest/v1/rpc/get_public_live_score`, {
        method: 'POST',
        headers: {
          'apikey': env.anon,
          'Authorization': `Bearer ${env.anon}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_match_id: matchId })
      });
      if (!response.ok) return null;
      return await response.json();
    } catch {
      return null;
    }
  }

  async function fetchLiveScore() {
    try {
      let data = null;
      if (activeEnv) {
        data = await callRpc(activeEnv);
      } else {
        data = await callRpc(ENVIRONMENTS[0]);
        if (data && data.found) {
          activeEnv = ENVIRONMENTS[0];
        } else {
          const stgData = await callRpc(ENVIRONMENTS[1]);
          if (stgData && stgData.found) {
            data = stgData;
            activeEnv = ENVIRONMENTS[1];
          }
        }
      }

      if (!data || !data.found) {
        showError('Match Not Found', 'This match does not exist or has not been synced to the cloud yet.');
        return;
      }

      renderMatch(data);
    } catch (err) {
      console.warn('Live fetch error:', err);
      footerEl.textContent = '⚡ Awaiting connection to scorer... Retrying automatically.';
    }
  }

  function renderMatch(data) {
    const match = data.match || {};
    const teamA = data.team_a || { name: 'Team A' };
    const teamB = data.team_b || { name: 'Team B' };
    const innings = data.innings || [];
    const activeInnNum = data.active_innings_number || 1;
    const currentInn = innings.find(i => i.innings_number === activeInnNum) || innings[0] || {};
    const isCompleted = match.status === 'completed';

    // Update Status Badge
    if (isCompleted) {
      liveBadgeEl.style.display = 'inline-flex';
      liveBadgeEl.style.background = 'var(--surface-sub)';
      liveBadgeEl.style.color = 'var(--muted)';
      liveBadgeEl.style.borderColor = 'var(--line)';
      liveBadgeEl.querySelector('.dot').style.display = 'none';
      liveTextEl.textContent = 'FINAL';
    } else {
      liveBadgeEl.style.display = 'inline-flex';
      liveBadgeEl.querySelector('.dot').style.display = 'inline-block';
      liveTextEl.textContent = 'LIVE';
    }

    // Format Run Rates
    const totalRuns = currentInn.total_runs || 0;
    const totalWickets = currentInn.total_wickets || 0;
    const legalBalls = currentInn.legal_balls || 0;
    const oversFormatted = currentInn.overs_formatted || '0.0';
    const crr = legalBalls > 0 ? ((totalRuns / legalBalls) * 6).toFixed(2) : '0.00';

    let equationHtml = '';
    if (isCompleted && match.result_summary) {
      equationHtml = `<div class="equation-banner finished">🏆 ${escapeHtml(match.result_summary)}</div>`;
    } else if (currentInn.target_runs && currentInn.target_runs > 0) {
      const runsNeeded = Math.max(0, currentInn.target_runs - totalRuns);
      const totalOvers = match.overs_per_innings || 20;
      const totalMatchBalls = totalOvers * 6;
      const ballsRemaining = Math.max(0, totalMatchBalls - legalBalls);
      const rrr = ballsRemaining > 0 ? ((runsNeeded / ballsRemaining) * 6).toFixed(2) : '-';
      equationHtml = `<div class="equation-banner">Need <b>${runsNeeded} runs</b> in <b>${ballsRemaining} balls</b> (RRR: ${rrr})</div>`;
    }

    // Recent Deliveries
    let ribbonHtml = '';
    const recent = data.recent_balls || [];
    if (recent.length > 0) {
      const ballsHtml = recent.slice(0, 12).reverse().map(b => {
        let cls = '';
        let label = b.total_runs.toString();
        if (b.wicket_type && b.wicket_type !== 'none') {
          cls = 'b-wicket';
          label = 'W';
        } else if (b.batter_runs === 4) {
          cls = 'b-four';
          label = '4';
        } else if (b.batter_runs === 6) {
          cls = 'b-six';
          label = '6';
        } else if (b.extras_type && b.extras_type !== 'none') {
          cls = 'b-extra';
          label = b.extras_type === 'wide' ? `${b.extras_runs}Wd` : `${b.extras_runs}Nb`;
        } else if (b.total_runs === 0) {
          label = '•';
        }
        return `<span class="ball-item ${cls}">${label}</span>`;
      }).join('');

      ribbonHtml = `
        <div style="margin-top:10px">
          <div class="section-title">Recent Balls</div>
          <div class="ball-ribbon">${ballsHtml}</div>
        </div>
      `;
    } else if (!isCompleted) {
      ribbonHtml = `
        <div style="margin-top:12px;padding:12px;background:var(--surface-sub);border:1px dashed var(--line);border-radius:10px;text-align:center;font:500 0.8rem var(--font-mono);color:var(--muted)">
          🏏 Match started. Waiting for the first ball...
        </div>
      `;
    }

    // Batters Table
    let battersHtml = '';
    const striker = data.striker;
    const nonStriker = data.non_striker;
    if (striker || nonStriker) {
      let rows = '';
      if (striker) {
        rows += `<tr>
          <td>${escapeHtml(striker.name)} <span class="striker-star">*</span></td>
          <td><b>${striker.runs}</b></td>
          <td>${striker.balls}</td>
          <td>${striker.fours}</td>
          <td>${striker.sixes}</td>
          <td>${striker.strike_rate}</td>
        </tr>`;
      }
      if (nonStriker) {
        rows += `<tr>
          <td>${escapeHtml(nonStriker.name)}</td>
          <td><b>${nonStriker.runs}</b></td>
          <td>${nonStriker.balls}</td>
          <td>${nonStriker.fours}</td>
          <td>${nonStriker.sixes}</td>
          <td>${nonStriker.strike_rate}</td>
        </tr>`;
      }

      battersHtml = `
        <div style="margin-top:12px">
          <div class="section-title">Batter</div>
          <table class="stats-table">
            <thead>
              <tr>
                <th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    } else if (!isCompleted) {
      battersHtml = `
        <div style="margin-top:12px;padding:12px;background:var(--surface-sub);border-radius:10px;text-align:center;font:500 0.8rem var(--font-body);color:var(--muted)">
          Players will appear here as soon as scoring starts.
        </div>
      `;
    }

    // Bowler Table
    let bowlerHtml = '';
    const bowler = data.bowler;
    if (bowler) {
      bowlerHtml = `
        <div style="margin-top:12px">
          <div class="section-title">Bowler</div>
          <table class="stats-table">
            <thead>
              <tr>
                <th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>${escapeHtml(bowler.name)}</td>
                <td>${bowler.overs_formatted}</td>
                <td>${bowler.runs_conceded}</td>
                <td><b>${bowler.wickets}</b></td>
                <td>${bowler.economy}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    // Innings History (if multi-innings)
    let historyHtml = '';
    if (innings.length > 1) {
      const pastRows = innings.map(inn => `
        <div class="innings-row">
          <span>${escapeHtml(inn.batting_team_short_name || inn.batting_team_name)} (Inn ${inn.innings_number})</span>
          <b>${inn.total_runs}/${inn.total_wickets} (${inn.overs_formatted} ov)</b>
        </div>
      `).join('');
      historyHtml = `
        <div style="margin-top:12px">
          <div class="section-title">All Innings</div>
          <div class="innings-history">${pastRows}</div>
        </div>
      `;
    }

    const battingTeamName = currentInn.batting_team_name || teamA.name;
    const bowlingTeamName = currentInn.bowling_team_name || teamB.name;

    mainEl.innerHTML = `
      <div class="match-card">
        <div class="match-meta">
          <span>${escapeHtml(match.venue || 'Local Ground')}</span>
          <span>${match.overs_per_innings || 20} Ov Match</span>
        </div>

        <div class="teams-row">
          <div class="team-item">
            <span class="team-name">${escapeHtml(battingTeamName)}</span>
            <span class="team-sub">Batting</span>
          </div>
          <span style="font:700 0.85rem var(--font-mono);color:var(--muted)">vs</span>
          <div class="team-item right">
            <span class="team-name">${escapeHtml(bowlingTeamName)}</span>
            <span class="team-sub">Bowling</span>
          </div>
        </div>

        <div class="score-box">
          <div>
            <span class="big-score">${totalRuns}/${totalWickets}</span>
            <span class="overs-text">(${oversFormatted} ov)</span>
          </div>
          <div class="run-rates">
            <span>CRR: <b>${crr}</b></span>
            ${currentInn.target_runs ? `<span>Target: <b>${currentInn.target_runs}</b></span>` : ''}
          </div>
        </div>

        ${equationHtml}
        ${ribbonHtml}
        ${battersHtml}
        ${bowlerHtml}
        ${historyHtml}
      </div>
    `;

    lastUpdatedAt = new Date();
    footerEl.textContent = `⚡ Live synced at ${lastUpdatedAt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})} • Auto-refreshing`;

    // If match completed, stop aggressive polling
    if (isCompleted && pollTimer) {
      clearInterval(pollTimer);
    }
  }

  function showError(title, message) {
    liveBadgeEl.style.display = 'none';
    mainEl.innerHTML = `
      <div class="error-box">
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(message)}</p>
      </div>
    `;
    footerEl.textContent = 'Inningz • Free Cricket Scoring App';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Initial fetch and poll every 6 seconds
  fetchLiveScore();
  pollTimer = setInterval(fetchLiveScore, 6000);
})();
</script>

</body>
</html>
